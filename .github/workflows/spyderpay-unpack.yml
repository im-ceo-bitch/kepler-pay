name: SpyderPay Core - Permanent Secure ZIP Update
on:
  push:
    branches: [main]
    paths:
      - 'spyderpay-core-update-*.zip'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spyderpay-core-updates
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      has_update: ${{ steps.unpack.outputs.has_update }}
      archive: ${{ steps.unpack.outputs.archive }}
      digest: ${{ steps.unpack.outputs.digest }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spyder_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: spyderpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spyder_test -d spyderpay_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      SPYDERPAY_TEST_PG_DSN: postgresql://spyder_test:test-only-password@127.0.0.1:5432/spyderpay_test
      SPYDERPAY_ENV: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: '3.13'
      - name: Validate and unpack in read-only checkout
        id: unpack
        run: |
          python3 -I -S - <<'PY_INSTALL'
          import hashlib, os, re, shutil, stat, tempfile, zipfile
          from pathlib import Path, PurePosixPath
          root=Path.cwd().resolve()
          pattern=re.compile(r'^spyderpay-core-update-v([0-9]{3,6})(?:-r([0-9]{1,4})|(-full))?\.zip$')
          roots={'README.md','pyproject.toml','Makefile','.gitignore','.env.example','compose.test.yaml'}
          allowed={'spyderpay_core','tests','docs','integrations','infrastructure','tools'}
          protected={'scripts/secure_unpack.py': 'f8da8e615d52d042f9e67a099ae7366baf5dbab5945d35e8ba65a96337e66e48', 'scripts/security_gate/test_release_contract.py': '05eed0327088456a65e23e9bedf4daa733fba30804778f9a0bbf88ce3f9eeb1f', 'scripts/cleanup_generated.py': '84a2ff1cae4fe771f9264a2a0eb44804ec9e39fbe7c25a89225965647e8a1afb'}
          blocked={'.git','.github','.env','.secrets','__MACOSX','__pycache__','.DS_Store','Thumbs.db','node_modules','.pytest_cache','.mypy_cache','.ruff_cache','.gitattributes','.gitmodules'}
          max_bytes=36*1024*1024

          def abort(reason): raise SystemExit(reason)
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def output(k,v):
              path=os.environ.get('GITHUB_OUTPUT')
              if path:
                  with open(path,'a',encoding='utf-8') as f: f.write(f'{k}={v}\n')

          def revision(m): return (int(m[1]),int(m[2] or 0))
          archives=[]
          for p in root.iterdir():
              m=pattern.fullmatch(p.name)
              if not m: continue
              if p.is_symlink() or not p.is_file(): abort('invalid archive path')
              archives.append((revision(m),p,m))
          if not archives:
              if os.environ.get('EXPECTED_DIGEST'): abort('verified archive missing')
              output('has_update','false'); print('No update ZIP found'); raise SystemExit(0)
          archives.sort(key=lambda x:x[0],reverse=True)
          version,archive,match=archives[0]
          if len(archives)>1 and archives[1][0]==version: abort('ambiguous newest release; keep one variant')
          if match[3]: abort('legacy full archive is not a supported new update; upload normal cumulative ZIP')
          if archive.stat().st_size>max_bytes: abort('archive too large')
          digest=sha(archive)
          if os.environ.get('EXPECTED_DIGEST') and (digest!=os.environ['EXPECTED_DIGEST'] or archive.name!=os.environ['EXPECTED_ARCHIVE']): abort('verified archive changed')
          installed=root/'spyderpay_core/release.py'
          if installed.is_file() and not installed.is_symlink():
              v=re.search(r"(?m)^VERSION\s*=\s*['\"]0\.([0-9]+)\.[0-9]+['\"]",installed.read_text())
              if v and version[0]<int(v[1]): abort('release downgrade rejected')
          with tempfile.TemporaryDirectory(prefix='spyderpay-overlay-') as temp, zipfile.ZipFile(archive) as z:
              stage=Path(temp); infos=z.infolist(); seen=set()
              if not 1<=len(infos)<=1000 or sum(i.file_size for i in infos)>max_bytes: abort('invalid archive limits')
              for i in infos:
                  n=i.filename; parts=n.split('/'); p=PurePosixPath(n)
                  if i.is_dir() or not n or '\\' in n or '\x00' in n or ':' in n or any(x in ('','.','..') or x.lower() in {b.lower() for b in blocked} for x in parts) or n.lower().endswith(('.p8','.p12','.pem','.key','.db','.sqlite','.sqlite3','.pyc','.mobileprovision')): abort('unsafe archive path: '+n)
                  if n not in roots and n not in protected and (len(parts)<2 or parts[0] not in allowed): abort('outside allowlist: '+n)
                  if n in seen or i.file_size>9*1024*1024 or stat.S_IFMT(i.external_attr>>16) not in (0,stat.S_IFREG): abort('unsafe member: '+n)
                  seen.add(n); target=root/n
                  if not target.resolve().is_relative_to(root) or any(q.is_symlink() for q in (target,*target.parents) if q!=root and q.is_relative_to(root)): abort('unsafe target: '+n)
                  if target.exists() and not target.is_file(): abort('non-file target: '+n)
                  if n in protected and target.exists() and sha(target)!=protected[n]: abort('existing protected bootstrap differs: '+n)
                  dest=stage/n; dest.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(i) as src,dest.open('wb') as dst: shutil.copyfileobj(src,dst)
                  if n in protected and sha(dest)!=protected[n]: abort('protected bootstrap hash mismatch: '+n)
              required={'pyproject.toml','spyderpay_core/release.py','spyderpay_core/postgres/api_v3.py','tests/postgres/test_postgres_core.py'}
              if not required<=seen: abort('incomplete cumulative archive')
              for n in seen:
                  if any(str(q) in seen for q in PurePosixPath(n).parents if str(q)!='.'): abort('file-directory collision')
              version_source=(stage/'spyderpay_core/release.py').read_text()
              release=re.search(r"(?m)^VERSION\s*=\s*['\"]0\.([0-9]+)\.[0-9]+['\"]",version_source)
              if not release or int(release[1])!=version[0]: abort('release version does not match filename')
              for n in sorted(seen):
                  target=root/n;target.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(stage/n,target)
          for n,h in protected.items():
              p=root/n
              if p.is_symlink() or not p.is_file() or sha(p)!=h: abort('trusted bootstrap missing or changed: '+n)
          # Remove only recognized release ZIPs, in checkout; no write to GitHub in verify.
          for _,p,_ in archives: p.unlink()
          output('has_update','true');output('archive',archive.name);output('digest',digest)
          print(f'Installed {len(seen)} files from {archive.name}; removed {len(archives)} update ZIP(s)')
          PY_INSTALL
      - name: Mandatory financial and security tests
        if: steps.unpack.outputs.has_update == 'true'
        run: |
          python -m venv "$RUNNER_TEMP/spyderpay-venv"
          source "$RUNNER_TEMP/spyderpay-venv/bin/activate"
          python -m pip install -e '.[dev]' 'pip-audit>=2.7,<3'
          python -m compileall -q spyderpay_core tools tests
          python -m pytest -q tests --ignore=tests/postgres --junitxml="$RUNNER_TEMP/spyderpay-unit.xml"
          python -m unittest discover -s scripts/security_gate -v
          python -m pytest -q tests/postgres --junitxml="$RUNNER_TEMP/spyderpay-pg.xml"
          python - "$RUNNER_TEMP/spyderpay-unit.xml" "$RUNNER_TEMP/spyderpay-pg.xml" <<'PY_CHECK'
          import sys, xml.etree.ElementTree as ET
          for filename, minimum in zip(sys.argv[1:], (148,48)):
              root=ET.parse(filename).getroot()
              suites=root.findall('testsuite') if root.tag=='testsuites' else [root]
              assert sum(int(s.attrib.get('tests',0)) for s in suites)>=minimum, 'missing tests'
              assert all(int(s.attrib.get('skipped',0))==0 for s in suites), 'skipped tests prohibited'
          PY_CHECK
          python -m bandit -q -r spyderpay_core
          python -m pip_audit --local
  apply:
    needs: verify
    if: needs.verify.result == 'success' && needs.verify.outputs.has_update == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check main has not advanced
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - name: Apply identical verified archive without executing package code
        env:
          EXPECTED_DIGEST: ${{ needs.verify.outputs.digest }}
          EXPECTED_ARCHIVE: ${{ needs.verify.outputs.archive }}
        run: |
          python3 -I -S - <<'PY_INSTALL'
          import hashlib, os, re, shutil, stat, tempfile, zipfile
          from pathlib import Path, PurePosixPath
          root=Path.cwd().resolve()
          pattern=re.compile(r'^spyderpay-core-update-v([0-9]{3,6})(?:-r([0-9]{1,4})|(-full))?\.zip$')
          roots={'README.md','pyproject.toml','Makefile','.gitignore','.env.example','compose.test.yaml'}
          allowed={'spyderpay_core','tests','docs','integrations','infrastructure','tools'}
          protected={'scripts/secure_unpack.py': 'f8da8e615d52d042f9e67a099ae7366baf5dbab5945d35e8ba65a96337e66e48', 'scripts/security_gate/test_release_contract.py': '05eed0327088456a65e23e9bedf4daa733fba30804778f9a0bbf88ce3f9eeb1f', 'scripts/cleanup_generated.py': '84a2ff1cae4fe771f9264a2a0eb44804ec9e39fbe7c25a89225965647e8a1afb'}
          blocked={'.git','.github','.env','.secrets','__MACOSX','__pycache__','.DS_Store','Thumbs.db','node_modules','.pytest_cache','.mypy_cache','.ruff_cache','.gitattributes','.gitmodules'}
          max_bytes=36*1024*1024

          def abort(reason): raise SystemExit(reason)
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def output(k,v):
              path=os.environ.get('GITHUB_OUTPUT')
              if path:
                  with open(path,'a',encoding='utf-8') as f: f.write(f'{k}={v}\n')

          def revision(m): return (int(m[1]),int(m[2] or 0))
          archives=[]
          for p in root.iterdir():
              m=pattern.fullmatch(p.name)
              if not m: continue
              if p.is_symlink() or not p.is_file(): abort('invalid archive path')
              archives.append((revision(m),p,m))
          if not archives:
