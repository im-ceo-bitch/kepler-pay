          DENIED_SUFFIXES = ('.p8','.p12','.pem','.key','.mobileprovision','.sqlite','.sqlite3','.db','.pyc')
          BOOTSTRAP_SHA256 = '4d53ef8167c4750d27efdc63800051bb6c665ea1c3c7c98fb44c2f1f092c110d'
          BOOTSTRAP_FILES = frozenset({'.env.example', '.gitignore', 'Makefile', 'README.md', 'compose.test.yaml', 'pyproject.toml', 'scripts/cleanup_generated.py', 'scripts/secure_unpack.py', 'scripts/security_gate/test_release_contract.py', 'tools/migrate_postgres.py', 'tools/sign_request.py'})
