              count=install(repo,matches[0],tuple(args.allow))
              print(f'Installed {count} allowlisted files and removed {matches[0].name}')


          if __name__=='__main__':
              try:
                  main()
              except (OSError,zipfile.BadZipFile,ValueError) as exc:
                  print(f'Safe ZIP unpack refused: {exc}',file=sys.stderr)
                  raise SystemExit(2)
          PYTHON_INSTALLER
          python - <<'PYTHON_CLEANUP'
          import subprocess
          from pathlib import Path
          root = Path.cwd()
          for name in subprocess.check_output(['git','ls-files','-z']).decode('utf-8').split('\0'):
              if not name:
                  continue
              p = Path(name)
              if p.name in {'.DS_Store','Thumbs.db'} or p.suffix == '.pyc' or any(x in {'__MACOSX','__pycache__','.pytest_cache','.mypy_cache','.ruff_cache'} for x in p.parts[:-1]):
                  if not any(q.is_symlink() for q in (root/p).parents if q != root) and ((root/p).is_file() or (root/p).is_symlink()):
                      (root/p).unlink()
          PYTHON_CLEANUP
      - name: Commit and push verified files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(spyderpay): apply verified ZIP update'
            git push origin HEAD:main
          fi
