                  raise ValueError('outside_allowlist')
              return str(p)


          def install(repo: Path, archive: Path, allowed: tuple[str,...]) -> int:
              repo = repo.resolve()
              if archive.is_symlink() or not archive.is_file():
                  raise ValueError('archive_not_regular')
