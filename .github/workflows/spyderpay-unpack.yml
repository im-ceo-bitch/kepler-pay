          output('has_update','true');output('archive',archive.name);output('digest',digest)
          print(f'Installed {len(seen)} files from {archive.name}; removed {len(archives)} update ZIP(s)')
          PY_INSTALL
      - name: Remove only known tracked generated files
        run: |
          python3 -I -S - <<'PY_CLEAN'
          import subprocess
          from pathlib import Path
          root=Path.cwd().resolve()
          for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
              if not raw: continue
              p=Path(raw.decode('utf-8'))
              if '.github' in p.parts or '.git' in p.parts: continue
              if p.name in {'.DS_Store','Thumbs.db'} or p.suffix=='.pyc' or any(x in {'__MACOSX','__pycache__','.pytest_cache','.ruff_cache','.mypy_cache'} for x in p.parts[:-1]):
                  t=root/p
                  if t.resolve().is_relative_to(root) and not any(q.is_symlink() for q in (t,*t.parents) if q!=root and q.is_relative_to(root)) and t.is_file(): t.unlink()
          PY_CLEAN
      - name: Commit verified update
        run: |
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet -- .github .gitmodules .gitattributes || { echo 'Protected paths changed'; exit 2; }
          git diff --cached --quiet || git commit -m 'chore(spyderpay): install verified cumulative update'
          git push origin HEAD:main
