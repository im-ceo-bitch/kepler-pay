# Dedicated private staging ingress. Two listeners, no direct API exposure.
# Install real PKI and firewall ACLs before deployment. The service CA must
# issue only service client identities; API HMAC and role checks still mandatory.
limit_req_zone $binary_remote_addr zone=sp_client:10m rate=8r/s;
limit_req_zone $binary_remote_addr zone=sp_service:10m rate=12r/s;
limit_conn_zone $binary_remote_addr zone=sp_connections:10m;

server {
    listen 127.0.0.1:8443 ssl;
    server_name spyderpay-client.invalid;
    ssl_certificate /run/secrets/staging-cert.crt;
    ssl_certificate_key /run/secrets/staging-key.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    client_max_body_size 16k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    large_client_header_buffers 2 12k;
    keepalive_timeout 5s;
    limit_conn sp_connections 8;
    limit_req_status 429;
    limit_req zone=sp_client burst=16 nodelay;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Only user-facing groups. Never forward client-supplied service credentials.
    location ~ ^/v3/(accounts|approvals|transfers|invoices|pos|cards)(/|$) {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Spyder-Key-Id "";
        proxy_set_header X-Spyder-Timestamp "";
        proxy_set_header X-Spyder-Nonce "";
        proxy_set_header X-Spyder-Signature "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 12s;
        proxy_send_timeout 6s;
        proxy_request_buffering on;
    }
    location / { return 404; }
}

server {
    listen 127.0.0.1:8444 ssl;
    server_name spyderpay-service.invalid;
    ssl_certificate /run/secrets/staging-cert.crt;
    ssl_certificate_key /run/secrets/staging-key.key;
    ssl_client_certificate /run/secrets/service-client-ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    client_max_body_size 16k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    large_client_header_buffers 2 12k;
    keepalive_timeout 5s;
    limit_conn sp_connections 8;
    limit_req_status 429;
    limit_req zone=sp_service burst=24 nodelay;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # No bearer tokens or user-facing routes on this ingress. Sandbox credit is
    # explicitly not exposed even when another /v3/ops path is allowed.
    location ^~ /v3/ops/sandbox/ { return 404; }
    location ~ ^/v3/(ops|bank|compliance|clearing|rail|finance)(/|$) {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Authorization "";
        proxy_set_header X-Spyder-Approval "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 12s;
        proxy_send_timeout 6s;
        proxy_request_buffering on;
    }
    location / { return 404; }
}
