# Include in a dedicated NGINX http context. Internal staging only.
# Provide real TLS certs, private-network ACLs and mTLS for /v3/ops/ at your ingress.
# This is a reference edge policy, not internet-scale DDoS protection.
limit_req_zone $binary_remote_addr zone=sp_ip:10m rate=8r/s;
limit_conn_zone $binary_remote_addr zone=sp_conn:10m;
server {
    listen 127.0.0.1:8443 ssl;
    server_name spyderpay-staging.invalid;
    ssl_certificate /run/secrets/staging-cert.crt;
    ssl_certificate_key /run/secrets/staging-key.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    client_max_body_size 16k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    large_client_header_buffers 2 12k;
    keepalive_timeout 5s;
    limit_conn sp_conn 8;
    limit_req_status 429;
    limit_req zone=sp_ip burst=16 nodelay;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 12s;
        proxy_send_timeout 6s;
        proxy_request_buffering on;
    }
}
