[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spyderpay-core"
version = "0.2.0"
description = "Pre-license private payment core reference implementation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "bandit>=1.8,<2"]

[tool.setuptools.packages.find]
include = ["spyderpay_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["pg: requires external PostgreSQL database"]

[tool.setuptools.package-data]
"spyderpay_core.postgres" = ["migrations/*.sql"]
