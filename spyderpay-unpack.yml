name: SpyderPay Core - Secure ZIP Update
on:
  push:
    branches: [main]
    paths:
      - 'spyderpay-core-update-v003-full.zip'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: spyderpay-core-updates
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: spyder_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: spyderpay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spyder_test -d spyderpay_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      SPYDERPAY_TEST_PG_DSN: postgresql://spyder_test:test-only-password@127.0.0.1:5432/spyderpay_test
      SPYDERPAY_ENV: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: '3.13'
      - name: Verify and unpack exact release
        run: |
          python3 - <<'PY_INSTALL'
          import hashlib, pathlib, shutil, stat, tempfile, zipfile
          from pathlib import Path, PurePosixPath
          root=Path.cwd().resolve()
          archive=root/'spyderpay-core-update-v003-full.zip'
          expected='e32431bb658b0e4b6e4f98f7ddd97e032b9f3f3503480a9e89c867cdac21e71d'
          if archive.is_symlink() or not archive.is_file() or archive.stat().st_size>36*1024*1024:
              raise SystemExit('missing or invalid update archive')
          if hashlib.sha256(archive.read_bytes()).hexdigest()!=expected:
              raise SystemExit('release SHA-256 mismatch')
          roots={'README.md','.gitignore','.env.example','Makefile','compose.test.yaml','pyproject.toml'}
          allowed={'spyderpay_core','tests','docs','integrations','infrastructure','scripts','tools'}
          blocked={'.git','.github','.env','.secrets','__MACOSX','__pycache__','.DS_Store','Thumbs.db','node_modules'}
          with tempfile.TemporaryDirectory(prefix='spyderpay-verified-') as temp, zipfile.ZipFile(archive) as z:
              stage=Path(temp)
              infos=z.infolist()
              if not 1<=len(infos)<=700 or sum(i.file_size for i in infos)>36*1024*1024:
                  raise SystemExit('unsafe archive size')
              seen=set()
              for info in infos:
                  name=info.filename
                  if info.is_dir() or '\\' in name or '\x00' in name or any(x in {'','..','.'} or x in blocked for x in name.split('/')) or ':' in name or name.lower().endswith(('.p8','.p12','.pem','.key','.db','.sqlite','.sqlite3','.pyc')):
                      raise SystemExit('unsafe archive path')
                  path=PurePosixPath(name)
                  if name not in roots and (len(path.parts)<2 or path.parts[0] not in allowed):
                      raise SystemExit('file outside release scope')
                  if name in seen or info.file_size>9*1024*1024 or stat.S_IFMT(info.external_attr>>16) not in (0,stat.S_IFREG):
                      raise SystemExit('unsafe archive member')
                  seen.add(name)
                  target=root/name
                  if not target.resolve().is_relative_to(root) or any(x.is_symlink() for x in (target,*target.parents) if x!=root and x.is_relative_to(root)):
                      raise SystemExit('unsafe destination')
                  p=stage/name;p.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(info) as src,p.open('wb') as dst:shutil.copyfileobj(src,dst)
              if not roots<=seen or 'spyderpay_core/postgres/api_v3.py' not in seen:
                  raise SystemExit('incomplete cumulative update')
              for name in sorted(seen):
                  target=root/name;target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(stage/name,target)
          archive.unlink()
          print(f'Installed {len(seen)} verified files; removed consumed archive')
          PY_INSTALL
      - name: Test in isolated environment (no repository write token)
        run: |
          python -m venv "$RUNNER_TEMP/spyderpay-venv"
          source "$RUNNER_TEMP/spyderpay-venv/bin/activate"
          python -m pip install -e '.[dev]' 'pip-audit>=2.7,<3'
          python -m compileall -q spyderpay_core tools tests
          python -m pytest -q tests --ignore=tests/postgres
          python -m unittest discover -s scripts/security_gate -v
          python -c 'import psycopg; import os; assert os.environ["SPYDERPAY_TEST_PG_DSN"]'
          python -m pytest -q tests/postgres --junitxml="$RUNNER_TEMP/spyderpay-pg.xml"
          python - "$RUNNER_TEMP/spyderpay-pg.xml" <<'PY_CHECK'
          import sys, xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          suites=root.findall('testsuite') if root.tag=='testsuites' else [root]
          assert sum(int(s.attrib.get('tests',0)) for s in suites)>=32, 'missing PostgreSQL tests'
          assert all(int(s.attrib.get('skipped',0))==0 for s in suites), 'PostgreSQL skips are prohibited'
          PY_CHECK
          python -m bandit -q -r spyderpay_core
          python -m pip_audit --local
  apply:
    needs: verify
    if: needs.verify.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify branch has not advanced
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - name: Apply identical release (never execute archive code)
        run: |
          python3 - <<'PY_INSTALL'
          import hashlib, pathlib, shutil, stat, tempfile, zipfile
          from pathlib import Path, PurePosixPath
          root=Path.cwd().resolve()
          archive=root/'spyderpay-core-update-v003-full.zip'
          expected='e32431bb658b0e4b6e4f98f7ddd97e032b9f3f3503480a9e89c867cdac21e71d'
          if archive.is_symlink() or not archive.is_file() or archive.stat().st_size>36*1024*1024:
              raise SystemExit('missing or invalid update archive')
          if hashlib.sha256(archive.read_bytes()).hexdigest()!=expected:
              raise SystemExit('release SHA-256 mismatch')
          roots={'README.md','.gitignore','.env.example','Makefile','compose.test.yaml','pyproject.toml'}
          allowed={'spyderpay_core','tests','docs','integrations','infrastructure','scripts','tools'}
          blocked={'.git','.github','.env','.secrets','__MACOSX','__pycache__','.DS_Store','Thumbs.db','node_modules'}
          with tempfile.TemporaryDirectory(prefix='spyderpay-verified-') as temp, zipfile.ZipFile(archive) as z:
              stage=Path(temp)
              infos=z.infolist()
              if not 1<=len(infos)<=700 or sum(i.file_size for i in infos)>36*1024*1024:
                  raise SystemExit('unsafe archive size')
              seen=set()
              for info in infos:
                  name=info.filename
                  if info.is_dir() or '\\' in name or '\x00' in name or any(x in {'','..','.'} or x in blocked for x in name.split('/')) or ':' in name or name.lower().endswith(('.p8','.p12','.pem','.key','.db','.sqlite','.sqlite3','.pyc')):
                      raise SystemExit('unsafe archive path')
                  path=PurePosixPath(name)
                  if name not in roots and (len(path.parts)<2 or path.parts[0] not in allowed):
                      raise SystemExit('file outside release scope')
                  if name in seen or info.file_size>9*1024*1024 or stat.S_IFMT(info.external_attr>>16) not in (0,stat.S_IFREG):
                      raise SystemExit('unsafe archive member')
                  seen.add(name)
                  target=root/name
                  if not target.resolve().is_relative_to(root) or any(x.is_symlink() for x in (target,*target.parents) if x!=root and x.is_relative_to(root)):
                      raise SystemExit('unsafe destination')
                  p=stage/name;p.parent.mkdir(parents=True,exist_ok=True)
                  with z.open(info) as src,p.open('wb') as dst:shutil.copyfileobj(src,dst)
              if not roots<=seen or 'spyderpay_core/postgres/api_v3.py' not in seen:
                  raise SystemExit('incomplete cumulative update')
              for name in sorted(seen):
                  target=root/name;target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(stage/name,target)
          archive.unlink()
          print(f'Installed {len(seen)} verified files; removed consumed archive')
          PY_INSTALL
      - name: Remove only known generated tracked files
        run: |
          python3 - <<'PY_CLEAN'
          import subprocess
          from pathlib import Path
          root=Path.cwd().resolve()
          for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
              if not raw: continue
              p=Path(raw.decode('utf-8'))
              if p.name in {'.DS_Store','Thumbs.db'} or p.suffix=='.pyc' or any(x in {'__MACOSX','__pycache__','.pytest_cache','.ruff_cache','.mypy_cache'} for x in p.parts[:-1]):
                  target=root/p
                  if target.resolve().is_relative_to(root) and not any(q.is_symlink() for q in target.parents if q.is_relative_to(root)) and (target.is_file() or target.is_symlink()):
                      target.unlink()
          PY_CLEAN
      - name: Commit verified source update
        run: |
          git config core.hooksPath /dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'chore(spyderpay): install security block 1 v0.3'
          git push origin HEAD:main
